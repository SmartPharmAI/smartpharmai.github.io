# Actualiza el índice de precios del comparador cuatro veces al día.
# Cada ejecución recorre la parte que le toca de cada tienda para dar una vuelta
# completa por semana, respetando robots.txt y la pausa entre páginas que pide cada
# tienda. Gratis en repositorios públicos.
name: Indexar precios

on:
  schedule:
    - cron: "15 */6 * * *"  # 00:15, 06:15, 12:15 y 18:15 UTC
  workflow_dispatch:         # también se puede lanzar a mano desde GitHub
    inputs:
      arranque:
        description: "Primer llenado del índice (sin cuota semanal)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: indexar-precios
  cancel-in-progress: false

jobs:
  indexar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recorrer tiendas y generar el índice
        run: python scraper/indexar.py --minutos 300 ${{ inputs.arranque && '--arranque' || '' }}

      - name: Guardar el índice en el repositorio
        run: |
          git config user.name "indexador-precios"
          git config user.email "actions@users.noreply.github.com"
          git add comparador/precios scraper/estado scraper/datos
          git diff --cached --quiet || git commit -m "Actualizar índice de precios"
          git push
